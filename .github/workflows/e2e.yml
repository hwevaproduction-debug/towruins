name: E2E Tests

on:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creapy_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creapy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creapy_test?schema=public
      FRONTEND_URL: http://127.0.0.1:3000
      JWT_EXPIRES_IN: 30d
      JWT_SECRET: e2e-test-secret
      LISTING_FEE_AMOUNT: 5
      TOKEN_PAYER_ROLE: LANDLORD
      NODE_ENV: test
      PAYMENT_PROVIDER: mock
      PORT: 5000
      SKIP_EMAIL_VERIFICATION: true
      SKIP_PHONE_VERIFICATION: true
      SMS_PROVIDER: mock
      TENANT_PREMIUM_AMOUNT: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare E2E database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npm run seed:db

      - name: Start E2E backend
        run: |
          SMS_PROVIDER=mock PAYMENT_PROVIDER=mock SKIP_EMAIL_VERIFICATION=true SKIP_PHONE_VERIFICATION=true DATABASE_URL="$DATABASE_URL" node server.js > e2e-server.log 2>&1 &
          echo $! > e2e-server.pid

          for attempt in {1..30}; do
            if nc -z localhost 5000; then
              exit 0
            fi
            sleep 1
          done

          cat e2e-server.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_ADMIN_EMAIL: admin@demo.com
          E2E_ADMIN_PASSWORD: demo1234
          SEED_API_BASE: api.townruins.com

  e2e-deployed:
    runs-on: ubuntu-latest
    env:
      SEED_API_BASE:           ${{ secrets.E2E_API_BASE_URL }}
      DATABASE_URL:            ${{ secrets.E2E_DATABASE_URL }}
      E2E_ADMIN_EMAIL:         ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD:      ${{ secrets.E2E_ADMIN_PASSWORD }}
      SKIP_EMAIL_VERIFICATION: "true"
      SKIP_PHONE_VERIFICATION: "true"
      PAYMENT_PROVIDER:        mock
      SMS_PROVIDER:            mock
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skip deployed E2E when API URL is not configured
        if: ${{ env.SEED_API_BASE == '' }}
        run: echo "E2E_API_BASE_URL secret is not configured; skipping deployed backend E2E."

      - name: Run deployed E2E tests
        if: ${{ env.SEED_API_BASE != '' }}
        run: npm run test:e2e
