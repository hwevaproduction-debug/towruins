services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creapy}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your environment or .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your environment or .env file}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-creapy}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - pgbackups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          file="/backups/creapy-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -Fc --file="$$file"
          find /backups -type f -name '*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep 86400
        done
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in your environment or .env file}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-30d}"
      COOKIE_SECRET: "${COOKIE_SECRET:?Set COOKIE_SECRET in your environment or .env file}"
      S3_BUCKET: "${S3_BUCKET:-creapy-uploads}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in your environment or .env file}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in your environment or .env file}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_PUBLIC_BASE_URL: "${S3_PUBLIC_BASE_URL:-https://app.townruins.com/creapy-uploads}"
      S3_BROWSER_ENDPOINT: "${S3_BROWSER_ENDPOINT:-https://app.townruins.com}"
      S3_BROWSER_FORCE_PATH_STYLE: "${S3_BROWSER_FORCE_PATH_STYLE:-true}"
    volumes:
      - uploads:/srv/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 --tries=1 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional Redis service. Disabled by default. To enable, remove the leading '#' from the lines below
  # and consider setting REDIS_URL in backend environment to redis://redis:6379
  #redis:
  #  image: redis:7
  #  restart: unless-stopped
  #  # Marked optional: use for caching, sessions, or rate-limiting

volumes:
  pgdata:
  pgbackups:
  uploads:
  minio_data:
