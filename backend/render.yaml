# ============================================================
# LEGACY FALLBACK — NOT CANONICAL
# This file is retained as a rollback reference only.
# The canonical production deployment is AWS Amplify backend.
# See DEPLOYMENT.md for the authoritative setup guide.
# ============================================================
services:
  - type: web
    name: creapy-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
        sync: false
      - key: PORT
        value: "5000"
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: TOKEN_PAYER_ROLE
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PAYNOW_RESULT_URL
        sync: false
      - key: PAYNOW_RETURN_URL
        # Set to your Amplify frontend URL, e.g. https://<branch>.<appid>.amplifyapp.com/payment-complete
        sync: false
      - key: LISTING_FEE_AMOUNT
        sync: false
      - key: TENANT_PREMIUM_AMOUNT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_PUBLIC_BASE_URL
        # Production must use a secure HTTPS public URL for uploaded assets.
        sync: false
      - key: S3_BROWSER_ENDPOINT
        # Optional browser-facing S3-compatible origin for presigned uploads.
        sync: false
      - key: S3_BROWSER_FORCE_PATH_STYLE
        sync: false
      - key: S3_ACCESS_KEY_ID # optional; omit when using IAM role
        sync: false
      - key: S3_SECRET_ACCESS_KEY # optional; omit when using IAM role
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SKIP_EMAIL_VERIFICATION
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        # Set to your Amplify frontend URL, e.g. https://<branch>.<appid>.amplifyapp.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Optional comma-separated origins for API and S3 upload CORS.
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMS_ENABLED
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: NOTIFICATION_WORKER_CRON
        sync: false
      - key: NOTIFICATION_BATCH_SIZE
        sync: false
      - key: MAX_NOTIFICATION_RETRIES
        sync: false
      - key: RECONCILIATION_INTERVAL_CRON
        sync: false
      - key: RECONCILIATION_STALE_MINUTES
        sync: false
      - key: MAX_PAYMENT_RETRIES
        sync: false
      - key: REMINDER_SCAN_CRON
        sync: false
      - key: EXPIRY_SCAN_CRON
        sync: false
      - key: SKIP_PRISMA_GENERATE_ON_START
        sync: false
