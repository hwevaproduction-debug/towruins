services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-towruins_staging}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - staging_minio_data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    restart: unless-stopped

  postgres-backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-towruins_staging}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - staging_pgbackups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          file="/backups/towruins-staging-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -Fc --file="$$file"
          find /backups -type f -name '*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep 86400
        done
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./.env.staging
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5500"
    environment:
      PORT: "5500"
    volumes:
      - staging_uploads:/srv/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5500/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 --tries=1 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_uploads:/srv/uploads:ro
    restart: unless-stopped

volumes:
  staging_pgdata:
  staging_pgbackups:
  staging_uploads:
  staging_minio_data:
