# --- Upstream Definitions ---
upstream backend {
    server backend:5000;
}

upstream frontend {
    server frontend:80;
}

upstream minio {
    server minio:9000;
}

# --- 0. HTTP Port 80 Block (Health Check + SSL Redirect) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Local health check endpoint for Docker
    location /health {
        access_log off;
        return 200 'OK';
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# --- STAGING (stage.townruins.com) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name stage.townruins.com;

    ssl_certificate     /etc/letsencrypt/live/stage.townruins.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.townruins.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
    }
}

# --- 1. API Subdomain (api.townruins.com) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.townruins.com;
    ssl_certificate     /etc/letsencrypt/live/townruins.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/townruins.com/privkey.pem;

    client_max_body_size 50m;

    if ($arg_phpinfo) {
        return 404;
    }

    # Drop common scanner probes at the edge proxy before they reach Express
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(?:bak|backup|dev|env|ini|local|log|old|phar|php|prod|save|sql|tmp)(?:$|/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:aws[.-]config\.js|aws-ses\.json|config\.(?:js|json|php)(?:\..*)?)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
    }
}

# --- 2. Main Frontend App & Uploads (townruins.com, app.townruins.com, www.townruins.com) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name townruins.com app.townruins.com www.townruins.com;
    ssl_certificate     /etc/letsencrypt/live/townruins.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/townruins.com/privkey.pem;

    client_max_body_size 50m;

    if ($arg_phpinfo) {
        return 404;
    }

    # Drop common scanner probes at the edge proxy before they reach frontend nginx
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(?:bak|backup|dev|env|ini|local|log|old|phar|php|prod|save|sql|tmp)(?:$|/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:aws[.-]config\.js|aws-ses\.json|config\.(?:js|json|php)(?:\..*)?)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Deny access to hidden files under uploads
    location ~ ^/uploads/\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve uploaded files from shared volume
    location /uploads/ {
        alias /srv/uploads/;
        autoindex off;
        sendfile on;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }

    # Browser-facing S3-compatible uploads. Presigned URLs are signed with this
    # public host and proxied to the internal MinIO service.
    location ^~ /creapy-uploads/ {
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }

    # Cache static assets proxied from frontend
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_buffering off;
    }

    # Frontend React App fallback
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;

        gzip on;
        gzip_proxied any;
    }
}
